# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: source/conf.py
  # Fail the build on a broken reference or a page missing from a toctree,
  # rather than publishing a site with silent gaps.
  fail_on_warning: true

python:
  install:
    - requirements: source/requirements.txt

formats:
  - pdf
  - htmlzip
